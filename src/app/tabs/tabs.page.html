<!--
  Contenedor principal de pestañas de App Shoper (sin encabezado global para
  maximizar el área útil bajo la barra de estado nativa):
  - Cliente: Catálogo, Carrito, Mis compras y Usuario (4 pestañas).
  - Tienda : Inventario, Pedidos y Usuario (3 pestañas).
-->
<ion-tabs>
  <ion-tab-bar slot="bottom" aria-label="Navegación principal de App Shoper">
    <!-- Pestaña 1: Catálogo (Cliente) o Inventario (Tienda). -->
    <ion-tab-button
      tab="tab1"
      href="/tabs/tab1"
      [attr.aria-label]="activeRole() === 'customer' ? 'Catálogo de productos' : 'Inventario de la tienda'">
      <ion-icon name="storefront-outline" aria-hidden="true"></ion-icon>
      <ion-label>{{ activeRole() === 'customer' ? 'Catálogo' : 'Inventario' }}</ion-label>
    </ion-tab-button>

    <!-- Pestaña 2 (Carrito): habilitada exclusivamente para el rol Cliente. -->
    @if (activeRole() === 'customer') {
      <ion-tab-button
        tab="tab2"
        href="/tabs/tab2"
        [attr.aria-label]="'Carrito de compras, ' + cartUnits() + ' unidades'">
        <ion-icon name="cart-outline" aria-hidden="true"></ion-icon>
        <ion-label>Carrito</ion-label>
        @if (cartUnits(); as units) {
          <ion-badge
            class="shoper-cart-badge-pop"
            color="primary"
            aria-hidden="true">{{ units }}</ion-badge>
        }
      </ion-tab-button>
    }

    <!-- Pestaña 3: Mis compras (Cliente) o Pedidos (Tienda). -->
    <ion-tab-button
      tab="tab3"
      href="/tabs/tab3"
      [attr.aria-label]="(activeRole() === 'customer' ? 'Mis compras, ' : 'Pedidos de la tienda, ') + activeOrdersCount() + ' pedidos activos'">
      <ion-icon name="receipt-outline" aria-hidden="true"></ion-icon>
      <ion-label>{{ activeRole() === 'customer' ? 'Mis compras' : 'Pedidos' }}</ion-label>
      @if (activeOrdersCount(); as activeOrders) {
        <ion-badge
          class="shoper-cart-badge-pop"
          color="secondary"
          aria-hidden="true">{{ activeOrders }}</ion-badge>
      }
    </ion-tab-button>

    <!-- Pestaña 4: Usuario, token JWT y cierre de sesión (Cliente y Tienda). -->
    <ion-tab-button
      tab="tab4"
      href="/tabs/tab4"
      aria-label="Usuario, token de sesión y cierre de sesión">
      <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
      <ion-label>Usuario</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
